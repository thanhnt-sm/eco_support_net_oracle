# Dependabot — keep GitHub Actions and NuGet dependencies up to date.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot
# NuGet: the VSIX csproj gates VSSDKBuildToolsAutoSetup to Windows so the Linux updater can evaluate DataGuard.sln (see CHANGELOG 2026-09-30).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: "Microsoft.Build.*"
        update-types: ["version-update:semver-major"]
      # FluentAssertions 8.x moved to a commercial (Xceed) licence; this MIT project stays on 6.x.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # MessagePack is a CVE pin for the VS SDK's transitive 2.5.x; VS 17.x ships 2.5.x, so stay in the 2.x line.
      - dependency-name: "MessagePack"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
