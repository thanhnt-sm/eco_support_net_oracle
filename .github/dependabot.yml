# Dependabot — keep GitHub Actions, NuGet, npm (VS Code extension) and Docker base images up to date.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot
# NuGet: the VSIX csproj gates VSSDKBuildToolsAutoSetup to Windows so the Linux updater can evaluate DataGuard.sln (see CHANGELOG 2026-09-30).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: "Microsoft.Build.*"
        update-types: ["version-update:semver-major"]
      # FluentAssertions 8+ is commercially licensed (Xceed); the project stays on the Apache-2.0 7.x line — decision recorded 2026-09-30.
      # scripts/check-nuget-licences.py (CI "NuGet/npm licence allow-list") fails on the 8.x licence file, so a slipped major cannot pass CI.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # MessagePack is a CVE pin for the VS SDK's transitive 2.5.x; VS 17.x ships 2.5.x, so stay in the 2.x line.
      - dependency-name: "MessagePack"
        update-types: ["version-update:semver-major"]
      # Roslyn line of the bundled analyzer: DataGuard.Analyzers / DataGuard.CodeFixes (and their test projects)
      # must stay on Microsoft.CodeAnalysis 4.12, the compiler VS 2022 17.12+ and the .NET 9.0.1xx SDK run; a newer
      # analyzer is refused with CS9057 (no squiggles). Guarded by RoslynReferenceVersionTests (<= 4.12.0.0) and
      # scripts/verify-analyzer-packaging.sh (lock-file assert + consumer built with SDK 9.0.100), so a manual bump
      # fails CI whatever SDK the runner has. Microsoft.CodeAnalysis.Analyzers 3.11.0 is the matching line.
      # Exact names on purpose (no wildcard: Microsoft.CodeAnalysis.NetAnalyzers keeps updating). Decision Q3a
      # (2026-10-14): the same rule also freezes the 5.9 copies in src/DataGuard.Core (in-process Roslyn for CLI
      # extraction, not the IDE) — Core Roslyn bumps are manual; tests/DataGuard.BinaryCompatibilityFixture references
      # Microsoft.CodeAnalysis.Common 5.9 and is not frozen.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: [">= 4.13.0"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        versions: [">= 4.13.0"]
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
        versions: [">= 4.13.0"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # VS Code extension (package-lock.json). Production dependencies are audited in ci.yml
  # (npm audit --omit=dev) and licence-checked by scripts/check-nuget-licences.py.
  - package-ecosystem: "npm"
    directory: "/src/DataGuard.VSCode"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Root Dockerfile base images (pinned by digest; Dependabot bumps tag + digest together).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
