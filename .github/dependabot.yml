# Dependabot — keep GitHub Actions and NuGet dependencies up to date.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
