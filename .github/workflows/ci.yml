name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"  # weekly full-history secret scan

# Least-privilege floor; individual jobs declare what they need.
permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"
  CROSS_PLATFORM_SOLUTION: DataGuard.CrossPlatform.slnf

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Guards the VSIX gate invariants in ci.yml/release.yml (shared assert after MSBuild,
      # fork-PR upload guard, release runs VS unit tests). See scripts/check-workflow-policy.py.
      # The ubuntu-24.04 runner-image README lists libyaml-dev and yamllint but no python3-yaml /
      # PyYAML, so the fallback cannot be proven dead and stays: hash-pinned via
      # scripts/requirements-ci.txt (--require-hashes, Scorecard Pinned-Dependencies), wheel-only
      # (no sdist build), user scope. The image's /etc/pip.conf sets break-system-packages, so pip may install.
      # The policy unit tests (scripts/tests) run first so the fixtures cannot rot silently.
      - name: Workflow policy check
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check-workflow-policy.py

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.CROSS_PLATFORM_SOLUTION }} --locked-mode

      # Dependabot expands the full DataGuard.sln on Linux (it ignores the slnf) and evaluates the
      # VSIX project post-restore through this ProjectReference; no other Linux job does. A Windows-only
      # import in the VSIX csproj (MSB4019, e.g. the mis-cased VSSDK targets) must fail here, not a week
      # later in the Dependabot job. Evaluation only (BuildProjectReferences=false: the referenced project
      # is evaluated, not compiled); locked mode keeps the committed lock files intact.
      - name: Linux evaluation parity (Dependabot)
        run: dotnet msbuild tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj -restore -t:ResolveProjectReferences -p:Configuration=Release -p:RestoreLockedMode=true -p:BuildProjectReferences=false -nologo -v:minimal

      # Every resolved NuGet package of DataGuard.sln (nuspec licence in the local cache) and every
      # production npm package of the VS Code extension (package-lock.json `license`) must be on
      # scripts/allowed-licences.txt (SPDX allow-list + justified per-package exceptions). Runs after
      # the parity step so the VSIX projects already have assets; fails closed on an unknown licence
      # (e.g. the Xceed community licence of FluentAssertions 8+, see CHANGELOG 2026-09-30).
      - name: NuGet/npm licence allow-list
        run: python3 scripts/check-nuget-licences.py

      # DataGuard's own licence surfaces (GPL-3.0-only + Commercial; Contracts stays MIT): no stale MIT in
      # README/docs/grants, central package metadata, GPL LICENSE text, byte-identical shipped notice copies.
      - name: DataGuard licence consistency
        run: python3 scripts/check-license-consistency.py

      - name: Build solution
        run: dotnet build ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-restore

      # Analyzer load gate: the bundled Roslyn analyzer must load under the compiler line VS 2022 17.12+ and
      # the .NET 9.0.1xx SDK run (Microsoft.CodeAnalysis 4.12). Roslyn refuses an analyzer built against a
      # newer compiler (warning CS9057) and reports nothing, and the floating 9.0.x SDK above (Roslyn >= 4.14)
      # would accept such an analyzer. A second SDK, 9.0.100 (Roslyn 4.12.0), is installed side by side; the
      # script pins it through the temp consumer's global.json (rollForward disable), fails on CS9057 or a
      # missing DG017/DG001, and also asserts the committed lock files resolve Roslyn to exactly 4.12.0
      # (scripts/assert-roslyn-lock.sh, unit-tested above). RoslynReferenceVersionTests cover the same
      # invariant from inside the test suites.
      - name: Setup .NET 9.0.100 (Roslyn 4.12 analyzer load gate)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.100"

      - name: Analyzer packaging and Roslyn 4.12 load gate
        run: |
          dotnet pack src/DataGuard.Analyzers/DataGuard.Analyzers.csproj --configuration Release --no-build -o "$RUNNER_TEMP/nupkg"
          dotnet pack src/DataGuard.Contracts/DataGuard.Contracts.csproj --configuration Release --no-build -o "$RUNNER_TEMP/nupkg"
          bash scripts/verify-analyzer-packaging.sh "$RUNNER_TEMP/nupkg"

      - name: Run analyzers
        run: dotnet build ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-restore /p:RunAnalyzers=true

      - name: Enforce formatting (dotnet format gate)
        run: timeout --signal=TERM --kill-after=30s 5m dotnet format ${{ env.CROSS_PLATFORM_SOLUTION }} --verify-no-changes --no-restore

      # Public-API consumer fixture (outside the slnf because it needs BaselineCoreAssembly). Compiling it
      # against the DataGuard.Core.dll built above fails when a public type, constructor or Deconstruct
      # shape the fixture uses is removed or changed. The retained-baseline binary run stays a manual check.
      - name: Build binary-compatibility fixture against current Core
        run: >-
          dotnet build tests/DataGuard.BinaryCompatibilityFixture/DataGuard.BinaryCompatibilityFixture.csproj
          --configuration Release
          -p:RestoreLockedMode=true
          -p:BaselineCoreAssembly="$GITHUB_WORKSPACE/src/DataGuard.Core/bin/Release/net9.0/DataGuard.Core.dll"

      # Category=LiveDb tests (Testcontainers, real databases) run in the live-db-integration job below.
      - name: Run tests (fail-fast)
        run: dotnet test ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-build --filter "Category!=LiveDb" --collect:"XPlat Code Coverage" --results-directory TestResults/dotnet-unit --logger trx

      - name: Validate .NET unit coverage (60% measured suite floor)
        id: unit-coverage
        run: python3 scripts/coverage_manifest.py --input TestResults/dotnet-unit --output TestResults/validated-unit --expect 5 --minimum 60 --github-output "$GITHUB_OUTPUT"

      - name: Upload test results
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/dotnet-unit/*.trx

      - name: Upload coverage
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: TestResults/validated-unit/

      - name: Convert TRX to JUnit XML for Test Analytics
        if: ${{ !cancelled() }}
        run: python3 scripts/trx_to_junit.py --input-glob "TestResults/dotnet-unit/*.trx" --output "TestResults/junit-dotnet-unit.xml"

      - name: Upload .NET unit coverage to Codecov
        if: ${{ success() && env.ACT != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.unit-coverage.outputs.files }}
          disable_search: true
          flags: dotnet-unit
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload .NET unit test results to Codecov
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: TestResults/junit-dotnet-unit.xml
          report_type: test_results
          flags: dotnet-unit
          use_oidc: true
          fail_ci_if_error: false

  # Real-database integration tests (Testcontainers: Oracle, SQL Server, PostgreSQL, MySQL). The two env
  # vars make a fixture whose container cannot start fail instead of skip, so this job cannot go green
  # without the databases actually running. Required job: no continue-on-error.
  live-db-integration:
    name: Live DB Integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      DATAGUARD_REQUIRE_LIVE_RELATIONAL: "1"
      DATAGUARD_REQUIRE_LIVE_SQLSERVER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.CROSS_PLATFORM_SOLUTION }} --locked-mode

      - name: Build solution
        run: dotnet build ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-restore

      - name: Run live database tests
        run: dotnet test ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-build --filter "Category=LiveDb" --collect:"XPlat Code Coverage" --results-directory TestResults/live-db --logger trx

      - name: Validate live DB coverage
        id: live-coverage
        run: python3 scripts/coverage_manifest.py --input TestResults/live-db --output TestResults/validated-live --expect 5 --github-output "$GITHUB_OUTPUT"

      - name: Preserve live DB coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-live-db
          path: TestResults/validated-live/
          if-no-files-found: error

      - name: Upload live DB test results
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-db-test-results
          path: "TestResults/live-db/*.trx"
          if-no-files-found: ignore

      - name: Convert live DB TRX to JUnit XML for Test Analytics
        if: ${{ !cancelled() }}
        run: python3 scripts/trx_to_junit.py --input-glob "TestResults/live-db/*.trx" --output "TestResults/junit-live-db.xml"

      - name: Upload live DB coverage to Codecov
        if: ${{ success() && env.ACT != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.live-coverage.outputs.files }}
          disable_search: true
          flags: live-db
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload live DB test results to Codecov
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: TestResults/junit-live-db.xml
          report_type: test_results
          flags: live-db
          use_oidc: true
          fail_ci_if_error: false

  # TypeScript unit tests of the VS Code extension plus a production-dependency audit. No .NET here:
  # `npm test` compiles and runs node --test; prepare-lsp (dotnet publish) is a packaging step only.
  vscode-extension:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: src/DataGuard.VSCode
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/DataGuard.VSCode/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Unit tests
        run: npm run test:coverage

      - name: Preserve VS Code coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-vscode
          path: |
            src/DataGuard.VSCode/coverage/lcov.info
            src/DataGuard.VSCode/coverage/manifest.json
            src/DataGuard.VSCode/coverage/coverage-summary.json
          if-no-files-found: error

      - name: Upload VS Code extension coverage to Codecov
        if: ${{ success() && env.ACT != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: src/DataGuard.VSCode/coverage/lcov.info
          disable_search: true
          flags: vscode-ext
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload VS Code extension test results to Codecov
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: src/DataGuard.VSCode/coverage/junit.xml
          report_type: test_results
          flags: vscode-ext
          use_oidc: true
          fail_ci_if_error: false

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Shell tests of the local git tooling (tools/git-tools). Each test builds throw-away bare/clone
  # repositories under mktemp; no network, no TTY (stdin is /dev/null, so prompts take their
  # non-interactive branch).
  scripts-tests:
    name: Scripts Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git tooling tests
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          for test in tests/git-tools/test_*.sh; do
            echo "::group::$test"
            bash "$test" < /dev/null
            echo "::endgroup::"
          done

  visual-studio-build-and-test:
    name: Visual Studio Build and Test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Visual Studio tests
        run: dotnet restore tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj --locked-mode

      - name: Run Visual Studio tests
        run: dotnet test tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults/visual-studio --diag TestResults/visual-studio/vstest.log

      - name: Preserve Windows collector diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          Get-ChildItem TestResults/visual-studio -Filter '*.log' -Recurse | ForEach-Object {
            Select-String -Path $_.FullName -Pattern '\[coverlet\].*(Unable|instrument|exclude|source|pdb|module)' | Select-Object -Last 40 | ForEach-Object { $_.Line }
          }

      - name: Preserve raw Windows collector results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-visual-studio-raw
          path: TestResults/visual-studio/
          if-no-files-found: error

      - name: Validate Windows coverage
        id: windows-coverage
        shell: bash
        run: python scripts/coverage_manifest.py --input TestResults/visual-studio --output TestResults/validated-windows --expect 1 --github-output "$GITHUB_OUTPUT"

      - name: Preserve Windows coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-visual-studio
          path: TestResults/validated-windows/
          if-no-files-found: error

      - name: Upload Windows coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.windows-coverage.outputs.files }}
          disable_search: true
          flags: visual-studio
          use_oidc: true
          fail_ci_if_error: false

  # The test job above compiles the package with CreateVsixContainer=false, so CreatePkgDef
  # reflection failures (TypeLoadException on exotic BCL/Interop types) never surface there.
  # This job performs the real VSSDK packaging build on every push/PR and asserts the VSIX
  # contains the bundled CLI, the Roslyn analyzers and a manifest whose version matches source.
  visual-studio-vsix-package:
    name: Visual Studio VSIX Packaging Gate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found on runner' }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package VSIX (CreateVsixContainer=true)
        shell: pwsh
        run: |
          & $env:MSBUILD src/DataGuard.VisualStudio/DataGuard.VisualStudio.csproj /restore /t:Build /p:Configuration=Release /p:CreateVsixContainer=true /p:DeployExtension=false /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "VSIX packaging build failed with exit code $LASTEXITCODE" }

      # Shared gate with release.yml (scripts/assert-vsix.ps1). Expected version is the
      # compiled fallback constant, which must equal the committed manifest version.
      - name: Assert VSIX contents
        shell: pwsh
        run: |
          $vsix = Get-ChildItem src/DataGuard.VisualStudio/bin/Release -Filter '*.vsix' -Recurse | Select-Object -First 1
          if ($null -eq $vsix) { throw 'VSSDK build did not produce a VSIX' }
          $sourceVersion = (Select-String -Path src/DataGuard.VisualStudio/ExtensionVersion.cs -Pattern 'Fallback = "([^"]+)"').Matches[0].Groups[1].Value
          & ./scripts/assert-vsix.ps1 -VsixPath $vsix.FullName -ExpectedVersion $sourceVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # VsixAnalyzerPackagingTests return silently when no VSIX exists (local runs, the test job's
      # CreateVsixContainer=false build). Here one was just packaged, so DATAGUARD_VSIX_EXPECTED=1 turns a
      # missing container into a failure and the tests assert the four analyzer assemblies
      # (Analyzers, CodeFixes, Contracts, SqlClassification) and their manifest assets (decision Q2a).
      # BuildProjectReferences=false: the test project compiles against the DataGuard.VisualStudio.dll the
      # packaging build above produced (BuildingForTesting only toggles pkgdef/VSIX generation) instead of
      # rebuilding the extension in the same obj/, whose incremental clean could remove the fresh .vsix.
      - name: Restore Visual Studio tests
        run: dotnet restore tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj --locked-mode

      - name: Run Visual Studio tests against the packaged VSIX
        env:
          DATAGUARD_VSIX_EXPECTED: "1"
        run: dotnet test tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj --configuration Release --no-restore -p:BuildProjectReferences=false

      # Fork PRs build the VSIX (the gate above still runs) but never publish it: an unsigned
      # installable built from untrusted code must not be hosted under this repository.
      - name: Upload VSIX artifact
        if: ${{ env.ACT != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataguard-visualstudio-vsix-ci-${{ github.sha }}
          path: src/DataGuard.VisualStudio/bin/Release/**/*.vsix
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies with NuGet audit
        run: >-
          dotnet restore DataGuard.sln --locked-mode
          -p:NuGetAuditMode=all
          '-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905'

      - name: Check for secrets with TruffleHog (commit range + working tree, fail on verified)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Exclude generated build artifacts — mach-o/PE chunks crash the
          # scanner (brotli PADDING_2 → exit 183) and carry no secret value.
          extra_args: --only-verified --exclude-paths .github/trufflehog-exclude-paths.txt
          version: "3.97.0"

      - name: TruffleHog full git history (verified secrets, fail)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm -v "$PWD:/pwd" -e "TARGET=/pwd" ghcr.io/trufflesecurity/trufflehog:3.97.0@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 git file:///pwd --no-update --only-verified --fail
        continue-on-error: false

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln --locked-mode

      - name: Install sbom-tool (pinned)
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate SBOM for solution
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          # -m is the output directory (must pre-exist); -bc must be a
          # directory; -o does not exist in sbom-tool 4.1.5.
          mkdir -p "$(pwd)/sbom" "$(pwd)/artifacts"
          sbom-tool generate \
            -b "$(pwd)/src" \
            -bc "$(pwd)/src" \
            -pn "DataGuard" \
            -pv "0.1.0-ci" \
            -ps "$(pwd)/artifacts" \
            -m "$(pwd)/sbom"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ./sbom/**/*
          retention-days: 7

  benchmark:
    name: Benchmark (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore benchmark project
        run: dotnet restore tools/benchmarks/DataGuard.Benchmarks/DataGuard.Benchmarks.csproj --locked-mode

      - name: Run deterministic benchmark smoke
        run: |
          DATAGUARD_BENCHMARK_COMMIT="$(git rev-parse HEAD)" \
          DATAGUARD_BENCHMARK_SDK="$(dotnet --version)" \
          DATAGUARD_BENCHMARK_WORKTREE=clean \
          dotnet run --project tools/benchmarks/DataGuard.Benchmarks/DataGuard.Benchmarks.csproj --configuration Release --no-restore -- --classifier-only --job Dry

      - name: Validate benchmark metadata
        run: python3 tools/benchmarks/DataGuard.Benchmarks/scripts/validate_benchmark_claim.py tools/benchmarks/DataGuard.Benchmarks/BenchmarkDotNet.Artifacts/benchmark-metadata.json

      - name: Restore observability benchmark project
        run: dotnet restore tools/benchmarks/DataGuard.Observability.Benchmarks/DataGuard.Observability.Benchmarks.csproj --locked-mode

      - name: Build observability benchmark project
        run: dotnet build tools/benchmarks/DataGuard.Observability.Benchmarks/DataGuard.Observability.Benchmarks.csproj --configuration Release --no-restore

      - name: Upload benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-artifacts
          path: tools/benchmarks/DataGuard.Benchmarks/BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
          retention-days: 7

  docker-smoke:
    name: Build and Smoke-Test Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Run on PRs (catch Dockerfile regressions pre-merge) and on main pushes.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dataguard:test
          load: true

      - name: Smoke test (CLI --help)
        run: docker run --rm dataguard:test --help

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          config-file: ./.github/codeql-config.yml

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore cross-platform solution
        run: dotnet restore ${{ env.CROSS_PLATFORM_SOLUTION }} --locked-mode

      - name: Build cross-platform solution
        run: dotnet build ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:csharp"
