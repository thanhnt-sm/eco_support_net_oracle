name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"  # weekly full-history secret scan

# Least-privilege floor; individual jobs declare what they need.
permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln --locked-mode

      - name: Build solution
        run: dotnet build DataGuard.sln --configuration Release --no-restore

      - name: Run analyzers
        run: dotnet build DataGuard.sln --configuration Release --no-restore /p:RunAnalyzers=true

      - name: Enforce formatting (dotnet format gate)
        run: dotnet format DataGuard.sln --verify-no-changes --no-restore

      - name: Run tests (fail-fast)
        run: dotnet test DataGuard.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test_results.trx"

      - name: Code Coverage Gate (Fail under 60%)
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import glob, sys
          from collections import defaultdict
          hits = defaultdict(bool)
          files = glob.glob('**/TestResults/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print("::error::No coverage files found!")
              sys.exit(1)
          for f in files:
              r = ET.parse(f).getroot()
              for cls in r.iter('class'):
                  fn = cls.attrib['filename']
                  for line in cls.iter('line'):
                      key = (fn, int(line.attrib['number']))
                      hits[key] = hits[key] or int(line.attrib['hits']) > 0
          total = len(hits)
          cov = sum(1 for v in hits.values() if v)
          rate = (cov / total * 100) if total > 0 else 0
          print(f"Overall Solution Line Coverage: {rate:.2f}% ({cov}/{total} lines)")
          if rate < 60.0:
              print(f"::error::Coverage {rate:.2f}% is below required threshold of 60.0%!")
              sys.exit(1)
          EOF
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln --locked-mode

      # `dotnet list package --vulnerable` always exits 0 even when
      # vulnerable packages are found — parse the JSON and fail explicitly.
      # Note: --vulnerable output only carries `vulnerabilities`; deprecated
      # packages need the separate --deprecated flag, so only vulnerable is
      # checked here.
      - name: List vulnerable NuGet packages (gate)
        run: |
          dotnet list DataGuard.sln package --vulnerable --include-transitive --format json > vuln.json || true
          python3 - <<'EOF'
          import json, sys
          with open('vuln.json') as f:
              data = json.load(f)
          if data.get('problems'):
              for p in data['problems']:
                  print(f"::error::Audit problem: {p.get('message', p)}")
              sys.exit(1)
          bad = []
          scanned = False
          for proj in data.get('projects', []):
              for fw in proj.get('frameworks', []):
                  scanned = True
                  for pkg in fw.get('topLevelPackages', []) + fw.get('transitivePackages', []):
                      if pkg.get('vulnerabilities'):
                          bad.append((pkg.get('id', pkg.get('name', '?')), proj.get('path', '?')))
          if not scanned:
              # SDK only emits 'frameworks' when vulnerabilities exist; an empty
              # project list without frameworks means a clean dependency set.
              print('No vulnerable packages found (no framework entries reported).')
              sys.exit(0)
          if bad:
              for name, path in bad:
                  print(f"::error::Vulnerable package: {name} ({path})")
              sys.exit(1)
          print('No vulnerable packages found.')
          EOF

      - name: Check for secrets with TruffleHog (commit range + working tree, fail on verified)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Exclude generated build artifacts — mach-o/PE chunks crash the
          # scanner (brotli PADDING_2 → exit 183) and carry no secret value.
          extra_args: --only-verified --exclude-paths .github/trufflehog-exclude-paths.txt
          version: "3.97.0"

      - name: TruffleHog full git history (verified secrets, fail)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm -v "$PWD:/pwd" -e "TARGET=/pwd" ghcr.io/trufflesecurity/trufflehog:3.97.0 git file:///pwd --no-update --only-verified --fail
        continue-on-error: false

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln --locked-mode

      - name: Install sbom-tool (pinned)
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate SBOM for solution
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          # -m is the output directory (must pre-exist); -bc must be a
          # directory; -o does not exist in sbom-tool 4.1.5.
          mkdir -p "$(pwd)/sbom" "$(pwd)/artifacts"
          sbom-tool generate \
            -b "$(pwd)/src" \
            -bc "$(pwd)/src" \
            -pn "DataGuard" \
            -pv "0.1.0-ci" \
            -ps "$(pwd)/artifacts" \
            -m "$(pwd)/sbom"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ./sbom/**/*
          retention-days: 7

  docker-smoke:
    name: Build and Smoke-Test Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Run on PRs (catch Dockerfile regressions pre-merge) and on main pushes.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dataguard:test
          load: true

      - name: Smoke test (CLI --help)
        run: docker run --rm dataguard:test --help

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: csharp
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:csharp"