name: Marketplace Extensions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package/publish (for example v0.2.0); empty uses package manifests."
        required: false
        type: string
      publish:
        description: "Publish the two validated VSIX artifacts to Marketplace."
        required: true
        default: false
        type: boolean

# Least-privilege floor. id-token/attestations: write are granted only to the two packaging jobs
# that attest, and their attest steps never run on pull_request.
permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  CROSS_PLATFORM_SOLUTION: DataGuard.CrossPlatform.slnf
  VSCODE_DIR: src/DataGuard.VSCode
  VISUAL_STUDIO_DIR: src/DataGuard.VisualStudio

jobs:
  # Same C# test gate as ci.yml's build-and-test (LiveDb excluded). Both packaging jobs need it, so
  # nothing is attested or published from a red suite (scripts/check-workflow-policy.py rule f).
  test:
    name: Build and test (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.CROSS_PLATFORM_SOLUTION }} --locked-mode

      - name: Build solution
        run: dotnet build ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.CROSS_PLATFORM_SOLUTION }} --configuration Release --no-build --filter "Category!=LiveDb"

  vscode-package:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write      # attest-build-provenance (Sigstore OIDC)
      attestations: write  # attest-build-provenance (attestation store)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify release ref
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::publish=true requires an immutable release tag"
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ] && [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked-out commit does not match tag $RELEASE_TAG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ env.VSCODE_DIR }}/package-lock.json

      # prepare-lsp (dotnet publish of the language server) and the SBOM tool need .NET.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install and test
        working-directory: ${{ env.VSCODE_DIR }}
        run: |
          npm ci
          npm test

      - name: Derive package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ -z "$version" ]; then
            version=$(node -p "require('./${VSCODE_DIR}/package.json').version")
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version '$version' is not SemVer"; exit 1 ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        working-directory: ${{ env.VSCODE_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          npm pkg set version="$VERSION"
          # prepare-lsp publishes server/DataGuard.LanguageServer.dll (loaded by extension.ts) before vsce.
          npm run prepare-lsp
          # --no-install: vsce comes from package-lock.json via `npm ci`, never a fresh download.
          npx --no-install @vscode/vsce package --out "$RUNNER_TEMP/dataguard-vscode-$VERSION.vsix"
          # Bare file name in the checksum line, so `sha256sum -c` works wherever the pair is downloaded.
          (cd "$RUNNER_TEMP" && sha256sum "dataguard-vscode-$VERSION.vsix" > "dataguard-vscode-$VERSION.vsix.sha256")

      - name: Generate VS Code extension SBOM
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          export PATH="$HOME/.dotnet/tools:$PATH"
          mkdir -p "$RUNNER_TEMP/dataguard-vscode-sbom"
          sbom-tool generate \
            -b "$GITHUB_WORKSPACE/$VSCODE_DIR" \
            -bc "$GITHUB_WORKSPACE/$VSCODE_DIR" \
            -pn "DataGuard VS Code Extension" \
            -pv "$VERSION" \
            -ps "$RUNNER_TEMP" \
            -m "$RUNNER_TEMP/dataguard-vscode-sbom"

      # Fork PRs build the VSIX (the tests above still run) but never publish it: an unsigned
      # installable built from untrusted code must not be hosted under this repository.
      - name: Upload VS Code VSIX
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataguard-vscode-vsix
          path: |
            ${{ runner.temp }}/dataguard-vscode-*.vsix
            ${{ runner.temp }}/dataguard-vscode-*.vsix.sha256
            ${{ runner.temp }}/dataguard-vscode-sbom/**/*
          if-no-files-found: error

      # No attestation for pull requests: a PR build is never published.
      - name: Attest VS Code VSIX
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dataguard-vscode-*.vsix

  visual-studio-package:
    name: Package Visual Studio Extension
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
      id-token: write      # attest-build-provenance (Sigstore OIDC)
      attestations: write  # attest-build-provenance (attestation store)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify release ref
        shell: pwsh
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:PUBLISH -eq 'true' -and [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw 'publish=true requires an immutable release tag'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
            $headCommit = git rev-parse HEAD
            if ($tagCommit -ne $headCommit) { throw "Checked-out commit does not match tag $env:RELEASE_TAG" }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Same unit-test gate as ci.yml/release.yml, before the manifest patch and packaging.
      - name: Restore Visual Studio tests
        run: dotnet restore tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj --locked-mode

      - name: Run Visual Studio tests
        run: dotnet test tests/DataGuard.VisualStudio.Tests/DataGuard.VisualStudio.Tests.csproj --configuration Release --no-restore

      - name: Derive VSIX version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$manifest = Get-Content "$env:VISUAL_STUDIO_DIR/source.extension.vsixmanifest"
            $version = $manifest.PackageManifest.Metadata.Identity.Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not SemVer"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set VSIX manifest version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $manifestPath = "$env:VISUAL_STUDIO_DIR/source.extension.vsixmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.PackageManifest.Metadata.Identity.Version = $env:VERSION
          $manifest.Save((Resolve-Path $manifestPath))

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw "MSBuild was not found" }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Same packaging command as ci.yml's Visual Studio VSIX Packaging Gate.
      - name: Restore and package VSIX
        shell: pwsh
        env:
          MSBUILD: ${{ steps.msbuild.outputs.path }}
        run: |
          & $env:MSBUILD "$env:VISUAL_STUDIO_DIR/DataGuard.VisualStudio.csproj" /restore /t:Build /p:Configuration=Release /p:CreateVsixContainer=true /p:DeployExtension=false /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Shared gate with ci.yml/release.yml/installers.yml (scripts/assert-vsix.ps1): required
      # entries + manifest version equal to the version patched in above.
      - name: Assert VSIX contents
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $vsix = Get-ChildItem "$env:VISUAL_STUDIO_DIR/bin/Release" -Filter '*.vsix' -Recurse | Select-Object -First 1
          if ($null -eq $vsix) { throw "VSSDK build did not produce a VSIX" }
          & ./scripts/assert-vsix.ps1 -VsixPath $vsix.FullName -ExpectedVersion $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage VSIX and checksum
        shell: pwsh
        run: |
          $vsix = Get-ChildItem "$env:VISUAL_STUDIO_DIR/bin/Release" -Filter '*.vsix' -Recurse | Select-Object -First 1
          if ($null -eq $vsix) { throw "VSSDK build did not produce a VSIX" }
          Copy-Item $vsix.FullName "$env:RUNNER_TEMP/DataGuard.VisualStudio.vsix"
          (Get-FileHash "$env:RUNNER_TEMP/DataGuard.VisualStudio.vsix" -Algorithm SHA256).Hash + "  DataGuard.VisualStudio.vsix" |
            Set-Content "$env:RUNNER_TEMP/DataGuard.VisualStudio.vsix.sha256"

      - name: Generate Visual Studio extension SBOM
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          $sbomTool = "$env:USERPROFILE\.dotnet\tools\sbom-tool.exe"
          if (-not (Test-Path $sbomTool)) { throw "sbom-tool was not installed" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dataguard-visualstudio-sbom" | Out-Null
          & $sbomTool generate `
            -b "$env:GITHUB_WORKSPACE\$env:VISUAL_STUDIO_DIR" `
            -bc "$env:GITHUB_WORKSPACE\$env:VISUAL_STUDIO_DIR" `
            -pn "DataGuard Visual Studio Extension" `
            -pv "$env:VERSION" `
            -ps "$env:RUNNER_TEMP" `
            -m "$env:RUNNER_TEMP\dataguard-visualstudio-sbom"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same fork-PR guard as the VS Code upload above (scripts/check-workflow-policy.py rule b).
      - name: Upload Visual Studio VSIX
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataguard-visualstudio-vsix
          path: |
            ${{ runner.temp }}/DataGuard.VisualStudio.vsix
            ${{ runner.temp }}/DataGuard.VisualStudio.vsix.sha256
            ${{ runner.temp }}/dataguard-visualstudio-sbom/**/*
          if-no-files-found: error

      # No attestation for pull requests: a PR build is never published.
      - name: Attest Visual Studio VSIX
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/DataGuard.VisualStudio.vsix

  # vsce comes from the extension's package-lock.json (`npm ci` + `npx --no-install`), never an
  # unpinned download inside the job that holds the Marketplace PAT. The VSIX is published only
  # after its checksum and its build-provenance attestation (made by vscode-package in this
  # repository) both verify.
  publish-vscode:
    name: Publish VS Code Marketplace
    needs: [vscode-package, visual-studio-package]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: marketplace-production
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ env.VSCODE_DIR }}/package-lock.json

      - name: Install pinned tooling from lockfile
        working-directory: ${{ env.VSCODE_DIR }}
        run: npm ci

      - name: Download VS Code VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dataguard-vscode-vsix
          path: ${{ runner.temp }}/vsix

      - name: Verify checksum and provenance attestation
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vsix"
          shopt -s nullglob
          vsix_files=(dataguard-vscode-*.vsix)
          if (( ${#vsix_files[@]} != 1 )); then
            echo "::error::Expected exactly one dataguard-vscode-*.vsix, found ${#vsix_files[@]}: ${vsix_files[*]}" >&2
            exit 1
          fi
          vsix="${vsix_files[0]}"
          test -f "$vsix.sha256" || { echo "::error::Missing $vsix.sha256" >&2; exit 1; }
          sha256sum -c "$vsix.sha256"
          gh attestation verify "$vsix" --repo "$GH_REPO"
          echo "path=$RUNNER_TEMP/vsix/$vsix" >> "$GITHUB_OUTPUT"

      # vsce reads the PAT from the VSCE_PAT environment variable, so it never appears on argv.
      - name: Publish verified artifact
        working-directory: ${{ env.VSCODE_DIR }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: ${{ steps.verify.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$VSCE_PAT" || { echo "::error::VSCE_PAT Marketplace Manage credential is required"; exit 1; }
          npx --no-install @vscode/vsce publish --packagePath "$VSIX_PATH"

  publish-visualstudio:
    name: Publish Visual Studio Marketplace
    needs: [vscode-package, visual-studio-package]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: windows-latest
    environment: marketplace-production
    steps:
      - name: Checkout publish manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download Visual Studio VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dataguard-visualstudio-vsix
          path: artifacts

      - name: Publish verified artifact
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VS_MARKETPLACE_PAT)) { throw "VS_MARKETPLACE_PAT is required" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $publisher = & $vswhere -latest -products * -find 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw "VsixPublisher.exe was not found; install the Visual Studio extension development workload" }
          & $publisher publish -payload "$PWD\artifacts\DataGuard.VisualStudio.vsix" -publishManifest "$env:VISUAL_STUDIO_DIR\vs-publish.json" -personalAccessToken $env:VS_MARKETPLACE_PAT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
