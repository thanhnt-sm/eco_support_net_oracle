name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Required when running manually."
        required: true
        type: string

# Global env
env:
  DOTNET_VERSION: "8.0.x"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"

# Top-level permissions are conservative; individual jobs request what they need.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a tag push, github.ref already points at the tag. On a manual
          # run there is no tag ref, so check out the tag given in the input.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln

      - name: Build solution
        run: dotnet build DataGuard.sln --configuration Release --no-restore

      - name: Run tests (fail-fast)
        run: |
          dotnet test DataGuard.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Pack NuGet packages
        run: |
          dotnet pack DataGuard.sln --configuration Release --no-build --output ./artifacts
          ls -la ./artifacts/

      - name: Upload NuGet packages (un-signed)
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          retention-days: 30

  sign-packages:
    name: Sign Packages with Sigstore (keyless)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write   # required for keyless cosign with OIDC
      attestations: write
      contents: read
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ./artifacts

      - name: Install sigstore (cosign)
        uses: sigstore/cosign-installer@v3
        with:
          # cosign-installer now refuses to install any cosign release older
          # than v2.6.0, so the previous "v2.2.0" pin failed at install time.
          cosign-release: "v2.6.0"

      - name: Verify cosign is available
        run: |
          if ! command -v cosign >/dev/null 2>&1; then
            echo "cosign not found after install" >&2
            exit 1
          fi
          cosign version

      - name: Sign packages (keyless) and produce .cosign signatures
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          shopt -s nullglob
          found=false
          for pkg in ./artifacts/*.nupkg; do
            found=true
            echo "Signing $pkg..."
            # --yes is required on cosign v2+: without it, sign-blob waits on
            # an interactive confirmation prompt that never comes in CI.
            cosign sign-blob --keyless --yes --output-signature="$pkg.cosign" "$pkg"
            if [ ! -f "$pkg.cosign" ]; then
              echo "Signature for $pkg not found" >&2
              exit 1
            fi
          done
          if [ "$found" = false ]; then
            echo "No packages found to sign in ./artifacts/*.nupkg" >&2
            exit 1
          fi
          ls -la ./artifacts

      - name: Verify signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in ./artifacts/*.nupkg; do
            sig="$pkg.cosign"
            if [ ! -f "$sig" ]; then
              echo "Missing signature for $pkg: $sig" >&2
              exit 1
            fi
            echo "Verifying $pkg with $sig..."
            # cosign v2+ requires an explicit expected identity/issuer for
            # keyless verification; without these flags verify-blob errors out.
            cosign verify-blob \
              --signature "$sig" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$pkg"
          done

      - name: Upload signed packages and signatures
        uses: actions/upload-artifact@v4
        with:
          name: signed-nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.cosign
          retention-days: 30

  generate-sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SBOM tool and add to PATH
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.Sbom.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          export PATH="$HOME/.dotnet/tools:$PATH"
          sbom-tool --version

      - name: Generate SBOM for each project
        run: |
          set -euo pipefail
          mkdir -p ./sbom ./artifacts
          shopt -s nullglob
          found=false
          for proj in src/*/DataGuard.*.csproj; do
            if [ -f "$proj" ]; then
              found=true
              name=$(basename "$proj" .csproj)
              echo "Generating SBOM for $name..."
              sbom-tool generate \
                -b "$(pwd)/src" \
                -bc "$proj" \
                -pn "DataGuard.$name" \
                -pv "${{ needs.build-and-test.outputs.release_version }}" \
                -ps "$(pwd)/artifacts" \
                -o "$(pwd)/sbom/$name"
            fi
          done
          if [ "$found" = false ]; then
            echo "No projects found matching src/*/DataGuard.*.csproj" >&2
            exit 1
          fi
          ls -la ./sbom || true

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: ./sbom/**/*
          retention-days: 30

  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [sign-packages, generate-sbom]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download signed packages and signatures
        uses: actions/download-artifact@v4
        with:
          name: signed-nupkgs
          path: ./artifacts

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: ./sbom

      - name: Check NUGET_API_KEY secret
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY || '' }}" ]; then
            echo "NUGET_API_KEY secret is not set" >&2
            exit 1
          fi

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pushed_any=false
          for pkg in ./artifacts/*.nupkg; do
            if [ -f "$pkg" ]; then
              echo "Publishing $pkg..."
              dotnet nuget push "$pkg" \
                --api-key "$NUGET_API_KEY" \
                --source "${{ env.NUGET_SOURCE }}" \
                --skip-duplicate
              pushed_any=true
            fi
          done
          if [ "$pushed_any" = false ]; then
            echo "No packages found to publish" >&2
            exit 1
          fi

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Download signed packages & signatures
        uses: actions/download-artifact@v4
        with:
          name: signed-nupkgs
          path: ./artifacts

      - name: Create Release (attach artifacts)
        uses: softprops/action-gh-release@v1
        with:
          # tag_name must be explicit: on a manual run there's no tag ref
          # for the action to infer a tag name from.
          tag_name: ${{ needs.build-and-test.outputs.release_version }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.cosign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-attestations:
    name: Publish Build Provenance Attestations
    runs-on: ubuntu-latest
    needs: [sign-packages, publish-nuget]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          name: signed-nupkgs
          path: ./artifacts

      # `gh attestation upload` does not exist (the gh CLI attestation group
      # only has download/verify/trusted-root). GitHub's supported way to
      # create and publish an attestation is this official action instead.
      - name: Generate and publish build provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "./artifacts/*.nupkg"

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, publish-nuget]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # "type=ref,event=tag" only produces a tag on a push-tag trigger;
          # "type=raw" with the resolved version covers manual dispatch too.
          tags: |
            type=raw,value=${{ needs.build-and-test.outputs.release_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
