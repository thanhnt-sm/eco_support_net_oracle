name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Required when running manually."
        required: true
        type: string

# Top-level permissions are conservative; individual jobs request what they need.
permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a tag push, github.ref already points at the tag. On a manual
          # run there is no tag ref, so check out the tag given in the input.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # tag keeps the "v" prefix (matches the git tag); version strips it
          # (NuGet package / SBOM / Docker tag use plain SemVer).
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln --locked-mode

      - name: Build solution
        run: dotnet build DataGuard.sln --configuration Release --no-restore

      - name: Run tests (fail-fast)
        run: |
          dotnet test DataGuard.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      # Package version MUST match the release tag (SemVer without the "v"
      # prefix). The csproj files hardcode 0.1.0-alpha.1 — overriding at pack
      # time keeps build output consistent with the GitHub release and makes
      # duplicate versions fail loudly instead of being silently skipped.
      - name: Pack NuGet packages
        run: |
          dotnet pack DataGuard.sln --configuration Release --no-build --output ./artifacts \
            -p:PackageVersion="$RELEASE_VERSION" \
            -p:Version="$RELEASE_VERSION"
          ls -la ./artifacts/
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload NuGet packages (un-signed)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          retention-days: 30

  security-scan:
    name: Security Scan (vulnerabilities + secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Match build-and-test: on dispatch, check out the tag from the input.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DataGuard.sln --locked-mode

      # `dotnet list package --vulnerable` always exits 0 even when vulnerable
      # packages are found — parse the JSON and fail explicitly. Also fails on
      # audit/restore errors reported in the 'problems' array.
      - name: List vulnerable NuGet packages (gate)
        run: |
          dotnet list DataGuard.sln package --vulnerable --include-transitive --format json > vuln.json || true
          python3 - <<'EOF'
          import json, sys
          with open('vuln.json') as f:
              data = json.load(f)
          if data.get('problems'):
              for p in data['problems']:
                  print(f"::error::Audit problem: {p.get('message', p)}")
              sys.exit(1)
          bad = []
          scanned = False
          for proj in data.get('projects', []):
              for fw in proj.get('frameworks', []):
                  scanned = True
                  for pkg in fw.get('topLevelPackages', []) + fw.get('transitivePackages', []):
                      if pkg.get('vulnerabilities'):
                          bad.append((pkg.get('id', pkg.get('name', '?')), proj.get('path', '?')))
          if not scanned:
              # SDK only emits 'frameworks' when vulnerabilities exist; an empty
              # project list without frameworks means a clean dependency set.
              print('No vulnerable packages found (no framework entries reported).')
              sys.exit(0)
          if bad:
              for name, path in bad:
                  print(f"::error::Vulnerable package: {name} ({path})")
              sys.exit(1)
          print('No vulnerable packages found.')
          EOF

      - name: Check for secrets with TruffleHog (commit range + working tree, fail on verified)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Exclude generated build artifacts — mach-o/PE chunks crash the
          # scanner (brotli PADDING_2 → exit 183) and carry no secret value.
          extra_args: --only-verified --exclude-paths .github/trufflehog-exclude-paths.txt
          version: "3.97.0"

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Match build-and-test: on dispatch, check out the tag from the input.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:csharp"

  sign-packages:
    name: Sign Packages with Sigstore (keyless)
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, codeql]
    permissions:
      id-token: write # required for keyless cosign with OIDC
      contents: read
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: ./artifacts

      - name: Install sigstore (cosign)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v2.6.0 was vulnerable to GHSA-fx35-mq7g-6g98 (fixed in v2.6.5/v3.1.3);
          # bundle output is the default format since cosign v3.1.
          cosign-release: "v3.1.3"

      - name: Verify cosign is available
        run: |
          if ! command -v cosign >/dev/null 2>&1; then
            echo "cosign not found after install" >&2
            exit 1
          fi
          cosign version

      - name: Sign packages (keyless) with bundle
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          shopt -s nullglob
          found=false
          for pkg in ./artifacts/*.nupkg; do
            found=true
            echo "Signing $pkg..."
            # --yes required on cosign v2+: sign-blob waits on an interactive
            # confirmation prompt that never comes in CI. --bundle stores
            # signature + certificate + tlog proof in one file (recommended).
            # NOTE: --keyless was removed in cosign v3 (keyless is the default).
            cosign sign-blob --yes --bundle "$pkg.sigstore.json" "$pkg"
            if [ ! -f "$pkg.sigstore.json" ]; then
              echo "Signature bundle for $pkg not found" >&2
              exit 1
            fi
          done
          if [ "$found" = false ]; then
            echo "No packages found to sign in ./artifacts/*.nupkg" >&2
            exit 1
          fi
          ls -la ./artifacts

      - name: Verify signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in ./artifacts/*.nupkg; do
            bundle="$pkg.sigstore.json"
            if [ ! -f "$bundle" ]; then
              echo "Missing signature bundle for $pkg: $bundle" >&2
              exit 1
            fi
            echo "Verifying $pkg with $bundle..."
            # cosign v2+ requires an explicit expected identity/issuer for
            # keyless verification; the bundle makes this offline-capable.
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$pkg"
          done

      - name: Upload signed packages and signature bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.sigstore.json
          retention-days: 30

  generate-sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SBOM tool and add to PATH
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$HOME/.dotnet/tools:$PATH"
          sbom-tool --version

      - name: Download NuGet packages to supply to the SBOM tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: ./artifacts

      - name: Generate SBOM for each project
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=false
          for proj in src/*/DataGuard.*.csproj; do
            if [ -f "$proj" ]; then
              found=true
              name=$(basename "$proj" .csproj)
              echo "Generating SBOM for $name..."
              # -m is the output directory (must pre-exist); -bc must be a
              # directory; -o does not exist in sbom-tool 4.1.5.
              mkdir -p "$(pwd)/sbom/$name"
              sbom-tool generate \
                -b "$(pwd)/src" \
                -bc "$(pwd)/src" \
                -pn "DataGuard.$name" \
                -pv "${{ needs.build-and-test.outputs.release_version }}" \
                -ps "$(pwd)/artifacts" \
                -m "$(pwd)/sbom/$name"
            fi
          done
          if [ "$found" = false ]; then
            echo "No projects found matching src/*/DataGuard.*.csproj" >&2
            exit 1
          fi
          ls -la ./sbom || true

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: ./sbom/**/*
          retention-days: 30

  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [sign-packages, generate-sbom]
    permissions:
      id-token: write # Trusted Publishing (OIDC)
      contents: read
    env:
      # Secrets are read through env vars — never interpolate ${{ secrets }}
      # into run scripts (script injection, CWE-094).
      NUGET_USER: ${{ secrets.NUGET_USER }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Download signed packages and signature bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-nupkgs
          path: ./artifacts

      - name: NuGet login (Trusted Publishing, OIDC)
        id: login
        # Trusted Publishing requires a matching trust policy registered on
        # nuget.org for NUGET_USER. When it is not configured the step fails
        # with HTTP 401; continue so publish falls back to NUGET_API_KEY.
        if: env.NUGET_USER != ''
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # nuget.org profile name, NOT an email address.
          user: ${{ env.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          LOGIN_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          KEY="${LOGIN_KEY:-}"
          if [ -n "${KEY}" ]; then
            echo "Using Trusted Publishing credentials."
          else
            KEY="${NUGET_API_KEY:-}"
            if [ -n "${KEY}" ]; then
              echo "Using NUGET_API_KEY fallback (legacy — expires 2026-11-01)."
            else
              echo "::error::No NuGet credentials. Set NUGET_USER (Trusted Publishing) or NUGET_API_KEY secret." >&2
              exit 1
            fi
          fi
          shopt -s nullglob
          pushed_any=false
          for pkg in ./artifacts/*.nupkg; do
            echo "Publishing $pkg..."
            # No --skip-duplicate: a duplicate version means the version
            # calculation is broken and must fail loudly.
            dotnet nuget push "$pkg" \
              --api-key "$KEY" \
              --source "${{ env.NUGET_SOURCE }}" \
              --timeout 600
            pushed_any=true
          done
          if [ "$pushed_any" = false ]; then
            echo "No packages found to publish" >&2
            exit 1
          fi

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Download signed packages & signature bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-nupkgs
          path: ./artifacts

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sboms
          path: ./sbom

      - name: Create draft release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
        run: |
          set -euo pipefail
          # A previous failed run may have left a draft behind; a published
          # release must never be silently overwritten.
          if gh release view "$RELEASE_TAG" --json isDraft -q .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Removing leftover draft release $RELEASE_TAG..."
              gh release delete --yes "$RELEASE_TAG"
            else
              echo "::error::Release $RELEASE_TAG already exists and is published." >&2
              exit 1
            fi
          fi
          # sbom-tool writes manifests three levels deep; bash does not enable
          # globstar by default, so collect files explicitly.
          mapfile -t sbom_assets < <(find ./sbom -name '*.json' -type f)
          if [ "${#sbom_assets[@]}" -eq 0 ]; then
            echo "::warning::No SBOM assets found to attach."
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG of DataGuard." \
            ./artifacts/*.nupkg \
            ./artifacts/*.sigstore.json \
            "${sbom_assets[@]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  publish-attestations:
    name: Publish Build Provenance Attestations
    runs-on: ubuntu-latest
    needs: [sign-packages, publish-nuget]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-nupkgs
          path: ./artifacts

      - name: Generate and publish build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "./artifacts/*.nupkg"

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, publish-nuget, security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU (arm64 builds on amd64 runners)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # On tag pushes, semver patterns derive from the tag (v1.2.3 -> 1.2.3)
          # and metadata-action's default flavor adds a `latest` marker. On
          # manual dispatch there is no tag ref, so the resolved version and a
          # `latest` marker are added explicitly.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.build-and-test.outputs.release_version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-and-test.outputs.release_version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max