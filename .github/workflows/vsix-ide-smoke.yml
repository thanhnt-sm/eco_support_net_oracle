name: VSIX IDE Stage1 smoke (manual)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character commit SHA approved for this run
        required: true
        type: string
permissions:
  contents: read
jobs:
  install-load:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'thanhnt-sm/eco_support_net_oracle'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify expected checkout revision
        shell: pwsh
        env:
          VSIX_SMOKE_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/vsix_smoke_revision.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - name: Harness failure contracts
        run: python -m unittest discover -s scripts/tests -p test_vsix_ide_smoke.py
      - name: Parse and compile probe with Windows PowerShell
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/vsix_ide_probe.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'Probe PowerShell syntax failed' }
          & powershell.exe -NoProfile -STA -File scripts/vsix_ide_probe.ps1 -ProcessId 0 -MajorVersion 17 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Probe C# helper compile failed' }
      - name: Build exact candidate using one selected installation
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $instances = @((& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.CoreEditor Microsoft.Component.MSBuild -format json) | ConvertFrom-Json)
          if ($instances.Count -ne 1) { throw 'No unique complete VS host' }
          $installation = $instances[0].installationPath
          $msbuild = Join-Path $installation 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild src/DataGuard.VisualStudio/DataGuard.VisualStudio.csproj /restore /t:Build /p:Configuration=Release /p:CreateVsixContainer=true /p:DeployExtension=false /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'VSIX build failed' }
          $vsix = @(Get-ChildItem src/DataGuard.VisualStudio/bin/Release -Filter '*.vsix' -Recurse)
          if ($vsix.Count -ne 1) { throw 'Expected exactly one built candidate' }
          $sourceVersion = (Select-String -Path src/DataGuard.VisualStudio/ExtensionVersion.cs -Pattern 'Fallback = "([^"]+)"').Matches[0].Groups[1].Value
          & ./scripts/assert-vsix.ps1 -VsixPath $vsix[0].FullName -ExpectedVersion $sourceVersion
          if ($LASTEXITCODE -ne 0) { throw 'VSIX package gate failed' }
          "DG_SMOKE_VSIX=$($vsix[0].FullName)" >> $env:GITHUB_ENV
          "DG_SMOKE_INSTANCE=$($instances[0].instanceId)" >> $env:GITHUB_ENV
      - name: Install exact VSIX and read canonical Options from owned IDE
        shell: pwsh
        run: python scripts/vsix_ide_smoke.py --vsix "$env:DG_SMOKE_VSIX" --evidence artifacts/vsix-ide-smoke/evidence.json
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-ide-stage1-${{ github.sha }}
          path: artifacts/vsix-ide-smoke/evidence.json
          if-no-files-found: warn
          retention-days: 7
