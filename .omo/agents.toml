# omp Agent Registry — opencode zen Free Models
# Source: https://opencode.net/zen/models (free tier)
# Updated: 2026-08-18

[agent]
# Default agent used when no explicit routing matches
default = "nemotron-3-ultra-free"

# Model routing rules: match task type → agent
# Priority: first match wins
routing = [
    { pattern = "reasoning|planning|architecture|design", agent = "nemotron-3-ultra-free" },
    { pattern = "coding|implementation|refactor|debug", agent = "llama-3.1-405b-free" },
    { pattern = "review|audit|security|analysis", agent = "nemotron-3-ultra-free" },
    { pattern = "quick|simple|chat|summarize", agent = "qwen2.5-coder-32b-free" },
    { pattern = "math|logic|proof|algorithm", agent = "nemotron-3-ultra-free" },
]

[[agents]]
name = "nemotron-3-ultra-free"
provider = "opencode-zen"
model = "nvidia/nemotron-3-ultra"
tags = ["reasoning", "planning", "architecture", "analysis", "math"]
context_window = 128000
max_output = 8192
temperature = 0.3
top_p = 0.95
description = "NVIDIA Nemotron 3 Ultra — best free model for complex reasoning, planning, architecture decisions"
endpoint = "https://api.opencode.net/zen/v1"
# Free tier: 50 requests/min, 200k tokens/min

[[agents]]
name = "llama-3.1-405b-free"
provider = "opencode-zen"
model = "meta-llama/llama-3.1-405b-instruct"
tags = ["coding", "implementation", "refactor", "debug", "rust", "typescript"]
context_window = 128000
max_output = 8192
temperature = 0.2
top_p = 0.9
description = "Meta Llama 3.1 405B — best free model for code generation, refactoring, debugging"
endpoint = "https://api.opencode.net/zen/v1"
# Free tier: 30 requests/min, 150k tokens/min

[[agents]]
