# OpenTelemetry Collector Contrib 0.160.0 (image digest pinned in Kubernetes artifacts).
# Agent tier: application/host-local intake only. It never talks to a business backend.
# Replace the Kubernetes gateway resolver and TLS file paths through deployment Secret/ConfigMap.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/otel/receiver-tls/tls.crt
          key_file: /etc/otel/receiver-tls/tls.key
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/otel/receiver-tls/tls.crt
          key_file: /etc/otel/receiver-tls/tls.key

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.node.name
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s
  filter/drop-probes:
    error_mode: ignore
    metric_conditions:
      - datapoint.attributes["http.route"] != nil and IsMatch(datapoint.attributes["http.route"], "^/(health|metrics)(/|$)")

exporters:
  load_balancing/gateway:
    routing_key: traceID
    protocol:
      otlp:
        tls:
          ca_file: /etc/otel/tls/ca.crt
          cert_file: /etc/otel/tls/tls.crt
          key_file: /etc/otel/tls/tls.key
        timeout: 5s
    resolver:
      k8s:
        service: otel-gateway-headless.observability
        ports: [4317]
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048
  load_balancing/gateway-service:
    routing_key: service
    protocol:
      otlp:
        tls:
          ca_file: /etc/otel/tls/ca.crt
          cert_file: /etc/otel/tls/tls.crt
          key_file: /etc/otel/tls/tls.key
        timeout: 5s
    resolver:
      k8s:
        service: otel-gateway-headless.observability
        ports: [4317]
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [load_balancing/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, filter/drop-probes, batch]
      exporters: [load_balancing/gateway-service]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [load_balancing/gateway-service]
  telemetry:
    metrics:
      level: Normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: warn
