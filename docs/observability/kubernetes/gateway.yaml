apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: observability
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: otel-gateway
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: docker.io/otel/opentelemetry-collector-contrib@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
          imagePullPolicy: IfNotPresent
          args: [--config=/conf/gateway.yaml]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          env:
            - name: LOKI_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: grafana-backends
                  key: loki-otlp-endpoint
            - name: MIMIR_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: grafana-backends
                  key: mimir-otlp-endpoint
            - name: GRAFANA_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-backends
                  key: tenant-id
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: backend-tls
              mountPath: /etc/otel/tls
              readOnly: true
            - name: receiver-server-tls
              mountPath: /etc/otel/receiver-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-collector-gateway-config
        - name: backend-tls
          secret:
            secretName: otel-backend-tls
            optional: false
        - name: receiver-server-tls
          secret:
            secretName: otel-gateway-server-tls
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway-headless
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: observability
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
