apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-agent-ingress-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              observability.data-ingest: "true"
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              observability.metrics-scrape: "true"
      ports:
        - port: 8888
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-gateway-ingress-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-agent
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              observability.metrics-scrape: "true"
      ports:
        - port: 8888
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              observability.backend-access: "true"
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
