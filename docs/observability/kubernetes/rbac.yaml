apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  labels:
    app.kubernetes.io/name: otel-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-endpointslice-reader
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-agent-endpointslice-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-endpointslice-reader
subjects:
  - kind: ServiceAccount
    name: otel-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-gateway-endpointslice-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-endpointslice-reader
subjects:
  - kind: ServiceAccount
    name: otel-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-k8sattributes
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: observability
